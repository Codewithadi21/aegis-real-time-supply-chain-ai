name: Publish DataPulse portfolio
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "datapulse-ai/portfolio/**"
      - ".github/workflows/datapulse-portfolio-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload DataPulse static portfolio
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./datapulse-ai/portfolio
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
