[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "datapulse-ai"
version = "0.1.0"
description = "Data-to-decision impact replay for silent ML data failures"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3","pandas>=2,<3","scikit-learn>=1.3,<2","scipy>=1.11,<2","matplotlib>=3.7,<4"]
[tool.setuptools.packages.find]
where = ["."]
include = ["datapulse*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
